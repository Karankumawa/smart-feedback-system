{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="glass-card">
        <h2>Change Password</h2>
        <form action="{{ url_for('change_password') }}" method="POST">
            <div class="input-group">
                <label for="current_password"
                    style="color: var(--text-color); margin-bottom: 0.5rem; display: block;">Current Password</label>
                <input type="password" name="current_password" id="current_password"
                    placeholder="Enter current password" required>
            </div>
            <div class="input-group">
                <label for="new_password" style="color: var(--text-color); margin-bottom: 0.5rem; display: block;">New
                    Password</label>
                <input type="password" name="new_password" id="new_password" placeholder="Enter new password" required>
            </div>
            <div class="input-group">
                <label for="confirm_password"
                    style="color: var(--text-color); margin-bottom: 0.5rem; display: block;">Confirm New
                    Password</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm new password"
                    required>
            </div>
            <button type="submit" class="btn-primary">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
